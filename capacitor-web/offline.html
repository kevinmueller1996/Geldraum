<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f5f0e8" />
    <title>Njora – gerade offline</title>
    <style>
      :root { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#34201b; background:#f5f0e8; }
      * { box-sizing:border-box; }
      body { min-height:100dvh; margin:0; padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom)); display:grid; place-items:center; background:#f5f0e8; }
      main { width:min(100%,430px); padding:34px 28px; border:1px solid rgba(77,35,30,.12); border-radius:28px; background:#fcf9f3; box-shadow:0 24px 70px rgba(77,35,30,.1); }
      span { width:58px; height:58px; display:grid; place-items:center; border:2px solid #4d231e; border-radius:50%; font-family:Georgia,serif; font-size:28px; }
      p:first-of-type { margin:30px 0 8px; color:#c96c58; font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
      h1 { margin:0; max-width:9ch; font-family:Georgia,serif; font-size:48px; line-height:.98; font-weight:500; letter-spacing:-.04em; }
      p:last-of-type { margin:20px 0 28px; color:rgba(52,32,27,.65); line-height:1.6; }
      a { display:grid; place-items:center; width:100%; min-height:52px; text-decoration:none; border-radius:999px; color:#fff9f2; background:#4d231e; font:inherit; font-weight:750; }
    </style>
  </head>
  <body>
    <main><span>N</span><p>Keine Verbindung</p><h1>Njora ist gleich wieder da.</h1><p>Bitte prüfe deine Internetverbindung. Deine persönlichen Finanzdaten bleiben geschützt auf dem Server.</p><a id="retry">Erneut verbinden</a></main>
  </body>
</html>
